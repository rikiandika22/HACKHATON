<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Autospec</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/images/lucide-lab_tire.png">
</head>

<body class="bg-[#F8F9FA] font-sans antialiased text-dark min-h-screen flex text-[15px]" x-data="authForm()">

    <!-- Toast Notification (Pop-up) -->
    <div x-show="toast.show" x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        class="fixed top-6 right-6 z-50 flex items-center p-4 mb-4 text-gray-500 bg-white rounded-lg shadow-xl border border-gray-100 max-w-sm"
        :class="toast.type === 'success' ? 'border-l-4 border-l-green-500' : 'border-l-4 border-l-red-500'" role="alert"
        style="display: none;">

        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
            :class="toast.type === 'success' ? 'text-green-500 bg-green-100' : 'text-red-500 bg-red-100'">
            <!-- Success Icon -->
            <svg x-show="toast.type === 'success'" class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                fill="currentColor" viewBox="0 0 20 20">
                <path
                    d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z" />
            </svg>
            <!-- Error Icon -->
            <svg x-show="toast.type === 'error'" class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                fill="currentColor" viewBox="0 0 20 20">
                <path
                    d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z" />
            </svg>
        </div>
        <div class="ms-3 text-sm font-semibold text-gray-800 tracking-wide pr-4" x-text="toast.message"></div>
        <button type="button" @click="toast.show = false"
            class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
            aria-label="Close">
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
            </svg>
        </button>
    </div>

    <!-- Left Side: Visual (Hidden on mobile) -->
    <div class="hidden lg:flex w-1/2 bg-[#1A1A1A] relative items-center justify-center overflow-hidden">
        <!-- Glowing Orb -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] opacity-40 mix-blend-screen pointer-events-none"
            style="background: radial-gradient(circle, rgba(255,90,54,0.6) 0%, transparent 60%);"></div>

        <!-- Car Image -->
        <img src="/assets/images/3d-car-with-simple-background 2.png" alt="Sport Car"
            class="relative z-10 w-[80%] object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.8)]" />

        <div class="absolute bottom-12 left-12 right-12 z-20 text-white">
            <h2 class="text-4xl lg:text-5xl font-light tracking-tight mb-2">TANYAKAN <span
                    class="font-bold">SPESIFIKASINYA.</span></h2>
            <p class="text-gray-400 text-lg font-medium">Masuk untuk mulai bertanya seputar spesifikasi, performa, dan
                kapasitas kendaraan incaran Anda.</p>
        </div>
    </div>

    <!-- Right Side: Form (Full width on mobile) -->
    <div x-data="authForm()"
        class="w-full lg:w-1/2 flex items-center justify-center p-6 md:p-12 relative overflow-hidden bg-[#F4F4F5]">

        <!-- Toast Notification (Pop-up) -->
        <div x-show="toast.show" style="display: none;" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
            x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
            class="fixed top-6 right-6 z-50 flex items-center p-4 mb-4 text-gray-500 bg-white rounded-lg shadow-xl border border-gray-100 max-w-sm"
            :class="toast.type === 'success' ? 'border-l-4 border-l-green-500' : 'border-l-4 border-l-red-500'"
            role="alert">

            <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
                :class="toast.type === 'success' ? 'text-green-500 bg-green-100' : 'text-red-500 bg-red-100'">
                <!-- Success Icon -->
                <svg x-show="toast.type === 'success'" class="w-5 h-5" aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z" />
                </svg>
                <!-- Error Icon -->
                <svg x-show="toast.type === 'error'" class="w-5 h-5" aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z" />
                </svg>
            </div>
            <div class="ms-3 text-sm font-semibold text-gray-800 tracking-wide pr-4" x-text="toast.message"></div>
            <button type="button" @click="toast.show = false"
                class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
                aria-label="Close">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                </svg>
            </button>
        </div>

        <!-- Top decorative dot grid -->
        <div class="absolute inset-0 opacity-[0.03] z-0"
            style="background-image: radial-gradient(#000 1.5px, transparent 1.5px); background-size: 24px 24px;"></div>

        <!-- Back Button -->
        <a href="/"
            class="absolute top-8 left-8 z-20 flex items-center gap-2 text-gray-500 hover:text-dark font-bold transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
            Kembali
        </a>

        <!-- Floating Glassmorphism Container -->
        <div
            class="w-full max-w-md relative z-10 bg-white/60 backdrop-blur-2xl border border-white/80 p-8 md:p-10 rounded-[2rem] shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)]">

            <div class="flex items-center gap-3 mb-10 justify-center">
                <img src="/assets/images/lucide-lab_tire.png"
                    class="w-8 h-8 filter invert-50 sepia-100 saturate-[4000%] hue-rotate-350 brightness-110 contrast-110"
                    style="filter: brightness(0) saturate(100%) invert(48%) sepia(87%) saturate(1478%) hue-rotate(345deg) brightness(101%) contrast(101%);" />
                <span class="text-2xl font-bold tracking-tight text-dark">AUTOSPEC</span>
            </div>

            <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Selamat Datang</h1>
            <p class="text-gray-500 text-center mb-8 font-medium">Masuk ke akun Anda untuk mulai bertanya.</p>

            <form class="space-y-5" @submit.prevent="submitLogin">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">Email</label>
                    <input type="email" x-model="email" placeholder="nama@email.com"
                        class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:border-[#FF5A36] focus:ring-2 focus:ring-[#FF5A36]/20 transition-all outline-none font-medium placeholder-gray-400"
                        required>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5 ml-1 mr-1">
                        <label class="block text-sm font-bold text-gray-700">Password</label>
                        <a href="#" class="text-sm font-bold text-primary hover:text-orange-600 transition-colors">Lupa
                            sandi?</a>
                    </div>
                    <input type="password" x-model="password" placeholder="••••••••"
                        class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:border-[#FF5A36] focus:ring-2 focus:ring-[#FF5A36]/20 transition-all outline-none font-medium placeholder-gray-400"
                        required>
                </div>

                <div class="pt-2">
                    <button type="submit" :disabled="isLoading"
                        class="w-full bg-[#FF5A36] text-white font-bold rounded-xl py-3.5 hover:bg-orange-600 transition-all shadow-[0_4px_14px_0_rgba(255,90,54,0.39)] hover:shadow-[0_6px_20px_rgba(255,90,54,0.23)] hover:-translate-y-0.5 mt-2 disabled:opacity-70 disabled:hover:translate-y-0 disabled:cursor-not-allowed"
                        x-text="isLoading ? 'Memproses...' : 'Masuk'">
                    </button>
                </div>
            </form>

            <script>
                document.addEventListener('alpine:init', () => {
                    Alpine.data('authForm', () => ({
                        email: '',
                        password: '',
                        isLoading: false,
                        toast: {
                            show: false,
                            message: '',
                            type: 'success'
                        },

                        showToast(message, type = 'success') {
                            this.toast.message = message;
                            this.toast.type = type;
                            this.toast.show = true;

                            setTimeout(() => {
                                this.toast.show = false;
                            }, 3000);
                        },

                        async submitLogin() {
                            this.isLoading = true;

                            try {
                                const response = await fetch('http://localhost:3000/api/auth/login', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ email: this.email, password: this.password })
                                });

                                const data = await response.json();

                                if (response.ok) {
                                    this.showToast('Login Berhasil! Mengalihkan...', 'success');
                                    localStorage.setItem('token', data.token);
                                    localStorage.setItem('user', JSON.stringify(data.user));

                                    // Give time for user to read toast before redirect
                                    setTimeout(() => {
                                        window.location.href = '/chat.html';
                                    }, 1500);
                                } else {
                                    this.showToast(data.message || 'Gagal masuk', 'error');
                                    this.isLoading = false;
                                }
                            } catch (error) {
                                this.showToast('Server error. Pastikan backend NodeJS berjalan.', 'error');
                                this.isLoading = false;
                            }
                        }
                    }));
                });
            </script>

            <p class="text-center mt-8 text-gray-500 font-medium">Belum punya akun? <a href="/register.html"
                    class="text-[#FF5A36] font-bold hover:underline">Daftar sekarang</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
