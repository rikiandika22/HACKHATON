<!-- Section 1: Header / Navbar -->
<header
    class="fixed z-50 top-4 left-1/2 -translate-x-1/2 w-[95%] max-w-4xl bg-white/20 backdrop-blur-md rounded-full border border-white/40 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] transition-all duration-300">
    <div class="px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a href="#" class="flex items-center gap-3">
                <img src="/assets/images/lucide-lab_tire.png" alt="Autospec Tire Icon"
                    class="brand-logo-anim w-8 h-8 object-contain filter invert-50 sepia-100 saturate-[4000%] hue-rotate-350 brightness-110 contrast-110"
                    style="filter: brightness(0) saturate(100%) invert(48%) sepia(87%) saturate(1478%) hue-rotate(345deg) brightness(101%) contrast(101%);" />
                <span class="text-xl md:text-2xl font-semibold tracking-tight text-dark">AUTOSPEC</span>
            </a>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex gap-8 font-semibold">
                <a href="#" class="nav-link text-dark hover:text-primary transition-colors">HOME</a>
                <a href="/chat.html" class="nav-link text-dark hover:text-primary transition-colors">AI ASSISTANT</a>
                <a href="#cars-part" class="nav-link text-dark hover:text-primary transition-colors">CARS
                    PART</a>
            </nav>

            <!-- Desk Right -->
            <div class="flex items-center gap-3">
                <a href="/login.html"
                    class="hidden md:inline-flex border border-dark text-dark px-6 py-2 rounded-full font-bold hover:bg-dark hover:text-white transition-colors duration-300">
                    LOGIN
                </a>
                <a href="/register.html"
                    class="hidden md:inline-flex bg-dark text-white px-6 py-2 rounded-full font-bold hover:bg-gray-800 transition-colors duration-300">
                    SIGN UP
                </a>

                <!-- Mobile Hamburger -->
                <button @click="toggleMenu" class="md:hidden text-dark p-2 focus:outline-none">
                    <svg x-show="!mobileMenuOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg x-show="mobileMenuOpen" style="display:none;" class="w-7 h-7" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-300 transform origin-top"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200 transform origin-top"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-4"
        class="md:hidden bg-white/30 backdrop-blur-lg border border-white/40 absolute w-[95%] left-1/2 -translate-x-1/2 top-20 rounded-2xl shadow-[0_8px_32px_0_rgba(31,38,135,0.07)]"
        style="display:none;">
        <div class="px-6 py-6 flex flex-col gap-4 text-center">
            <a href="#" @click="closeMenu"
                class="text-lg font-bold text-dark hover:text-primary transition-colors">HOME</a>
            <a href="/chat.html" @click="closeMenu"
                class="text-lg font-bold text-dark hover:text-primary transition-colors">AI ASSISTANT</a>
            <a href="#cars-part" @click="closeMenu"
                class="text-lg font-bold text-dark hover:text-primary transition-colors">CARS
                PART</a>

            <div class="flex flex-col gap-3 mt-4">
                <a href="/login.html"
                    class="border border-dark text-dark px-6 py-3 rounded-full font-bold hover:bg-dark hover:text-white transition-colors">LOGIN</a>
                <a href="/register.html"
                    class="bg-dark text-white px-6 py-3 rounded-full font-bold hover:bg-gray-800 transition-colors">SIGN
                    UP</a>
            </div>
        </div>
    </div>
</header>
